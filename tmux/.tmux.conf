# default shell
set -g default-shell /opt/homebrew/bin/fish

# prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# splits — open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# mouse
set -g mouse on

# vi mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# scrollback
set -g history-limit 50000

# start windows/panes at 1
set -g base-index 1
set -pg pane-base-index 1
set-option -g renumber-windows on

# status bar — rose-pine main
set -g status-position top
set -g status-style "bg=#1f1d2e,fg=#908caa"
set -g status-left "#[bg=#31748f,fg=#e0def4,bold] #S #[bg=#1f1d2e,fg=#31748f]"
set -g status-left-length 30
set -g status-right "#[fg=#6e6a86] %H:%M "

set -g window-status-format "#[fg=#6e6a86] #I:#W "
set -g window-status-current-format "#[bg=#26233a,fg=#e0def4,bold] #I:#W "

set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#31748f"

set -g message-style "bg=#26233a,fg=#e0def4"

# pane navigation (prefix + hjkl)
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# session switching (prefix + [ / ])
bind [ switch-client -p
bind ] switch-client -n

# sessionizer
bind -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
